<svg viewBox="0 0 700 545" xmlns="http://www.w3.org/2000/svg"
     font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#48485e"/>
    </marker>
    <marker id="arr-l" markerWidth="7" markerHeight="5" refX="1" refY="2.5" orient="auto">
      <polygon points="7 0,0 2.5,7 5" fill="#48485e"/>
    </marker>

    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e0e14"/>
      <stop offset="100%" stop-color="#0a0a10"/>
    </linearGradient>
    <linearGradient id="panel-c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161622"/>
      <stop offset="100%" stop-color="#111118"/>
    </linearGradient>
    <linearGradient id="panel-s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131318"/>
      <stop offset="100%" stop-color="#0f0f14"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d1d2e"/>
      <stop offset="100%" stop-color="#17172400"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="700" height="545" rx="14" fill="url(#bg)"/>

  <!-- ─── CLIENT SIDE panel ──────────────────────────────── -->
  <rect x="15" y="15" width="670" height="185" rx="10"
        fill="url(#panel-c)" stroke="#252535" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="350" y="34" text-anchor="middle" font-size="9" font-weight="600"
        fill="#35354a" letter-spacing="6">C L I E N T   S I D E</text>

  <!-- ── Your App ── -->
  <rect x="28" y="46" width="148" height="130" rx="8"
        fill="#17172a" stroke="#252540" stroke-width="1"/>
  <rect x="28" y="46" width="148" height="3" rx="3" fill="#303048"/>
  <text x="102" y="88" text-anchor="middle" font-size="14" font-weight="600" fill="#d0d0e8">Your App</text>
  <text x="102" y="110" text-anchor="middle" font-size="11" fill="#5c5c80">browser · proxy</text>
  <text x="102" y="127" text-anchor="middle" font-size="11" fill="#5c5c80">CLI · SOCKS5</text>
  <text x="102" y="158" text-anchor="middle" font-size="10" fill="#3a3a58">TCP client</text>

  <!-- TCP arrows -->
  <line x1="176" y1="97"  x2="191" y2="97"  stroke="#48485e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="191" y1="117" x2="176" y2="117" stroke="#48485e" stroke-width="1.5" marker-end="url(#arr-l)"/>
  <text x="183" y="93" text-anchor="middle" font-size="9" fill="#3a3a58">TCP</text>

  <!-- ── slipstream-client ── -->
  <rect x="193" y="46" width="477" height="130" rx="8"
        fill="#17172a" stroke="#252540" stroke-width="1"/>
  <rect x="193" y="46" width="477" height="3" rx="3" fill="#303048"/>
  <text x="431" y="84" text-anchor="middle" font-size="15" font-weight="600" fill="#d8d8f0">slipstream-client</text>
  <text x="431" y="108" text-anchor="middle" font-size="11" fill="#5c5c80">QUIC packets  →  DNS TXT queries  (base32-encoded)</text>
  <text x="431" y="126" text-anchor="middle" font-size="11" fill="#5c5c80">DNS responses  →  QUIC stream data</text>
  <text x="431" y="156" text-anchor="middle" font-size="10" fill="#3a3a58">multipath QUIC  ·  end-to-end encrypted  ·  SIP003</text>

  <!-- DNS/UDP arrow ↓ -->
  <line x1="431" y1="200" x2="431" y2="258"
        stroke="#3a3a52" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <rect x="440" y="216" width="90" height="18" rx="4" fill="#0e0e14"/>
  <text x="485" y="229" text-anchor="middle" font-size="10" fill="#42425c">DNS / UDP  53</text>

  <!-- ─── DNS Resolver ────────────────────────────────────── -->
  <rect x="275" y="258" width="312" height="57" rx="8"
        fill="#141420" stroke="#222232" stroke-width="1"/>
  <rect x="275" y="258" width="312" height="3" rx="3" fill="#2a2a40"/>
  <text x="431" y="282" text-anchor="middle" font-size="13" font-weight="600" fill="#c0c0de">DNS Resolver</text>
  <text x="431" y="301" text-anchor="middle" font-size="11" fill="#4c4c6e">public recursive  ·  or your own authoritative NS</text>

  <!-- DNS/UDP arrow ↓ -->
  <line x1="431" y1="315" x2="431" y2="363"
        stroke="#3a3a52" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <rect x="440" y="330" width="90" height="18" rx="4" fill="#0a0a10"/>
  <text x="485" y="343" text-anchor="middle" font-size="10" fill="#42425c">DNS / UDP  53</text>

  <!-- ─── SERVER SIDE panel ──────────────────────────────── -->
  <rect x="15" y="363" width="670" height="167" rx="10"
        fill="url(#panel-s)" stroke="#1e2020" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="350" y="381" text-anchor="middle" font-size="9" font-weight="600"
        fill="#2a3030" letter-spacing="6">S E R V E R   S I D E</text>

  <!-- ── slipstream-server ── -->
  <rect x="193" y="388" width="477" height="105" rx="8"
        fill="#121a16" stroke="#1e2e26" stroke-width="1"/>
  <rect x="193" y="388" width="477" height="3" rx="3" fill="#243028"/>
  <text x="431" y="422" text-anchor="middle" font-size="15" font-weight="600" fill="#c8e8d8">slipstream-server</text>
  <text x="431" y="446" text-anchor="middle" font-size="11" fill="#4a7060">DNS TXT  ↔  QUIC frames  ·  unwraps stream payload</text>
  <text x="431" y="475" text-anchor="middle" font-size="10" fill="#385448">auto TLS (ECDSA P-256)  ·  stateless reset  ·  Tokio async</text>

  <!-- TCP arrow ↓ -->
  <line x1="431" y1="493" x2="431" y2="516"
        stroke="#243028" stroke-width="1" marker-end="url(#arr)"/>
  <text x="449" y="509" font-size="10" fill="#2a4038">TCP</text>

  <!-- ── Target Service ── -->
  <rect x="305" y="516" width="252" height="26" rx="6"
        fill="#0e1812" stroke="#1a2a20" stroke-width="1"/>
  <text x="431" y="533" text-anchor="middle" font-size="12" font-weight="500" fill="#7aaa90">Target Service</text>

  <!-- Caption -->
  <text x="350" y="538" text-anchor="middle" font-size="0" fill="none"/>
  <!-- bottom padding element for viewBox -->
</svg>
