<svg width="680" height="520" viewBox="0 0 680 520"
     xmlns="http://www.w3.org/2000/svg"
     font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#6e7681"/>
    </marker>
    <marker id="al" markerWidth="7" markerHeight="5" refX="1" refY="2.5" orient="auto">
      <polygon points="7 0,0 2.5,7 5" fill="#6e7681"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="520" rx="12" fill="#0d1117"/>

  <!-- ══ CLIENT SIDE panel ════════════════════════════════════ -->
  <rect x="14" y="14" width="652" height="185" rx="8"
        fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="326" y="32" text-anchor="middle" font-size="9" font-weight="600"
        fill="#484f58" letter-spacing="5">C L I E N T   S I D E</text>

  <!-- Your App -->
  <rect x="26" y="42" width="148" height="132" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <rect x="26" y="42" width="148" height="2" rx="2" fill="#388bfd" opacity="0.5"/>
  <text x="100" y="84"  text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Your App</text>
  <text x="100" y="106" text-anchor="middle" font-size="11" fill="#8b949e">browser · proxy</text>
  <text x="100" y="123" text-anchor="middle" font-size="11" fill="#8b949e">CLI · SOCKS5</text>
  <text x="100" y="155" text-anchor="middle" font-size="10" fill="#484f58"
        font-family="'SF Mono', Menlo, Consolas, monospace">TCP client</text>

  <!-- TCP arrows -->
  <line x1="174" y1="96"  x2="190" y2="96"  stroke="#6e7681" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="190" y1="114" x2="174" y2="114" stroke="#6e7681" stroke-width="1.5" marker-end="url(#al)"/>
  <text x="182" y="92" text-anchor="middle" font-size="9" fill="#484f58">TCP</text>

  <!-- slipstream-client -->
  <rect x="192" y="42" width="460" height="132" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <rect x="192" y="42" width="460" height="2" rx="2" fill="#388bfd" opacity="0.5"/>
  <text x="422" y="80"  text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">slipstream-client</text>
  <text x="422" y="104" text-anchor="middle" font-size="11" fill="#8b949e">QUIC packets  →  DNS TXT queries  (base32)</text>
  <text x="422" y="122" text-anchor="middle" font-size="11" fill="#8b949e">DNS responses  →  QUIC stream data</text>
  <text x="422" y="154" text-anchor="middle" font-size="10" fill="#484f58"
        font-family="'SF Mono', Menlo, Consolas, monospace">multipath QUIC · end-to-end encrypted · SIP003</text>

  <!-- DNS/UDP arrow ↓ -->
  <line x1="422" y1="199" x2="422" y2="254"
        stroke="#30363d" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <rect x="438" y="216" width="94" height="17" rx="4" fill="#0d1117"/>
  <text x="485" y="229" text-anchor="middle" font-size="10"
        fill="#6e7681" font-family="'SF Mono', Menlo, Consolas, monospace">DNS / UDP 53</text>

  <!-- ══ DNS Resolver ════════════════════════════════════════ -->
  <rect x="272" y="254" width="300" height="56" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
  <text x="422" y="278" text-anchor="middle" font-size="13" font-weight="600" fill="#cdd9e5">DNS Resolver</text>
  <text x="422" y="297" text-anchor="middle" font-size="11" fill="#6e7681">public recursive  ·  or your own authoritative NS</text>

  <!-- DNS/UDP arrow ↓ -->
  <line x1="422" y1="310" x2="422" y2="360"
        stroke="#30363d" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <rect x="438" y="326" width="94" height="17" rx="4" fill="#0d1117"/>
  <text x="485" y="339" text-anchor="middle" font-size="10"
        fill="#6e7681" font-family="'SF Mono', Menlo, Consolas, monospace">DNS / UDP 53</text>

  <!-- ══ SERVER SIDE panel ════════════════════════════════════ -->
  <rect x="14" y="360" width="652" height="146" rx="8"
        fill="#0f1419" stroke="#30363d" stroke-width="1"/>
  <text x="326" y="377" text-anchor="middle" font-size="9" font-weight="600"
        fill="#3d4451" letter-spacing="5">S E R V E R   S I D E</text>

  <!-- slipstream-server -->
  <rect x="192" y="382" width="460" height="100" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <rect x="192" y="382" width="460" height="2" rx="2" fill="#3fb950" opacity="0.4"/>
  <text x="422" y="416" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">slipstream-server</text>
  <text x="422" y="440" text-anchor="middle" font-size="11" fill="#8b949e">DNS TXT  ↔  QUIC frames  ·  unwraps stream payload</text>
  <text x="422" y="470" text-anchor="middle" font-size="10" fill="#484f58"
        font-family="'SF Mono', Menlo, Consolas, monospace">auto TLS (ECDSA P-256) · stateless reset · Tokio async</text>

  <!-- TCP arrow ↓ -->
  <line x1="422" y1="482" x2="422" y2="504"
        stroke="#30363d" stroke-width="1" marker-end="url(#a)"/>
  <text x="440" y="497" font-size="10" fill="#484f58"
        font-family="'SF Mono', Menlo, Consolas, monospace">TCP</text>

  <!-- Target Service -->
  <rect x="302" y="504" width="240" height="24" rx="5" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
  <text x="422" y="520" text-anchor="middle" font-size="12" font-weight="500" fill="#8b949e">Target Service</text>
</svg>
